name: Bug report
description: Something in ZERO Launcher does not work as it should
labels: ["bug"]
body:
- type: markdown
  attributes:
    value: |
      Thanks for taking the time to report this. Please search the [existing issues](https://github.com/6402770-sys/ZeroCraft-Launcher/issues) first.
      If the problem only happens with one modpack or mod, try **Tools > Crash Detective** in ZERO before reporting.
- type: input
  attributes:
    label: ZERO version
    description: The version you installed (also listed in Windows Settings > Apps).
    placeholder: "1.0.0"
  validations:
    required: true
- type: input
  attributes:
    label: Windows version
    placeholder: "Windows 11 24H2"
- type: textarea
  attributes:
    label: What happened?
    description: What you did, what you expected, and what you saw instead. Screenshots help a lot.
  validations:
    required: true
- type: textarea
  attributes:
    label: Steps to reproduce
    placeholder: |
      1. Open ...
      2. Click ...
      3. See ...
- type: textarea
  attributes:
    label: Logs
    description: If the game was involved, upload the log from the instance's Minecraft Log page (use a paste site, do not include account tokens).
